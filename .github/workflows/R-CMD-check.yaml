name: R-CMD-check

on:
  # push only on the long-lived branches; pull_request covers everything else.
  # Listing a branch pattern in both made every push to a branch with an open
  # PR run the whole matrix twice on the same commit. The pull_request filter
  # matches the BASE branch, so it names the integration branches a pull
  # request can target: main, and the pre-release branch of an unreleased
  # version. The retired one-branch-per-release model is not among them.
  push:
    branches: [main]
  pull_request:
    branches: [main, 'pre-release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stan-export-regeneration:
    # The name is load bearing: the ruleset protecting `main` requires a check
    # called "Stan export parity", so renaming this job silently blocks every
    # merge on a check that can never report. The job itself no longer merely
    # compares field names; it regenerates and diffs.
    name: Stan export parity
    runs-on: ubuntu-latest
    # Blocking gate: the committed src/stanExports_* must not lag inst/stan.
    # `configure` regenerates them at install time, so drift never reaches end
    # users, but a stale snapshot means the tracked C++ and every local rstan
    # build are behind the Stan source.
    #
    # This regenerates into a scratch copy and diffs, so it catches ANY content
    # change. Its predecessor compared only the data field NAMES a model
    # declares, and a change inside a function body adds no field: commit
    # bdd8a9e edited a shared include, the job passed, and main carried an
    # export one edit behind inst/stan until it was noticed by hand.
    #
    # rstan_config() only writes .cc/.h; nothing is compiled, so this runs in
    # seconds.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rstantools
      - name: Regenerate Stan exports and diff against the tracked copies
        shell: bash
        run: |
          set -euo pipefail
          WT=$(mktemp -d)
          cp -R DESCRIPTION NAMESPACE R inst src configure "$WT"/
          (cd "$WT" && Rscript -e 'rstantools::rstan_config(".")')
          drift=0
          # Compare the file SETS in both directions first. Walking only the
          # tracked names would miss a model added to inst/stan whose export
          # was never committed: regeneration writes it under $WT alone, the
          # loop never looks there, and the job passes with the exports
          # incomplete.
          (cd src && ls stanExports_*.h stanExports_*.cc 2>/dev/null | sort) > "$WT/tracked.list"
          (cd "$WT/src" && ls stanExports_*.h stanExports_*.cc 2>/dev/null | sort) > "$WT/regen.list"
          if ! diff -q "$WT/tracked.list" "$WT/regen.list" >/dev/null 2>&1; then
            echo "DRIFT: the tracked export set differs from the regenerated one"
            diff "$WT/tracked.list" "$WT/regen.list" || true
            drift=1
          fi
          # stanc stamps its own version into every header, so an unrelated
          # StanHeaders release would turn every file red with no .stan change.
          # Compare the generated code, not the toolchain that generated it.
          # Both places stanc writes its version. The second sits inside a
          # quoted string that opens BEFORE the key, `{"stanc_version = stanc3
          # v2.39.0"`, so a pattern anchored on a quoted VALUE never matches
          # it and the normalization silently does nothing.
          strip_stamp() { sed -e 's|// Code generated by stanc v.*|// Code generated by stanc|' \
                              -e 's|stanc_version = stanc3 v[0-9][0-9.]*|stanc_version = stanc3|' "$1"; }
          for f in src/stanExports_*.h src/stanExports_*.cc; do
            b=$(basename "$f")
            [ -f "$WT/src/$b" ] || continue
            if ! diff -q <(strip_stamp "$f") <(strip_stamp "$WT/src/$b") >/dev/null 2>&1; then
              echo "DRIFT: $b"
              drift=1
            fi
          done
          # rstan_config() also rewrites R/stanmodels.R, which names the models
          # it found under inst/stan. Adding or removing a model changes that
          # file and nothing under src/, so diff it too.
          if ! diff -q R/stanmodels.R "$WT/R/stanmodels.R" >/dev/null 2>&1; then
            echo "DRIFT: R/stanmodels.R"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            echo
            echo "Regenerate with rstantools::rstan_config() and commit the result."
            exit 1
          fi
          echo "Stan exports match inst/stan."

  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # r-lib/actions/setup-r exports NOT_CRAN=true unless it is already set, so
      # without this line every skip_on_cran() test would RUN here and this
      # matrix would stop emulating CRAN: the platform checks would take the
      # Stan-fitting path that CRAN never takes, and a platform-specific
      # sampling failure would be reported as a check failure CRAN cannot
      # reproduce. Setting it false makes these five jobs match what the CRAN
      # machines actually execute. The Stan tests are run deliberately, once,
      # by the full-test-suite job below.
      NOT_CRAN: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            stan-dev/cmdstanr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  full-test-suite:
    name: Full test suite (Stan tests enabled)
    runs-on: ubuntu-latest
    # The matrix above pins NOT_CRAN=false so it reproduces CRAN, which means
    # every skip_on_cran() test is skipped there. That is right for the platform
    # checks (the Stan fits would blow the CRAN time limit) but it leaves the
    # survival family, the newdata transport tests, and the relaxed-model
    # subgroup identification test unexecuted. This job is the one place they
    # run. It uses cmdstanr for the sweep, and finishes with an explicit rstan
    # step, because rstan is the package default and the engine CRAN users get.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
            stan-dev/cmdstanr
          needs: check

      - name: Install CmdStan
        run: cmdstanr::install_cmdstan(cores = 2)
        shell: Rscript {0}

      - name: Run the full test suite
        run: |
          pkgload::load_all(".")
          options(mlumr.stan_engine = "cmdstanr")
          res <- testthat::test_dir("tests/testthat", package = "mlumr",
                                    reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          cat("pass", sum(df$passed), "fail", sum(df$failed),
              "skip", sum(df$skipped), "\n")
          # A test that ABORTS is recorded in `error`, not in `failed`, so a
          # gate that reads only `failed` can pass a run in which a whole file
          # died. testthat's own success helper requires both to be clear.
          if (sum(df$failed) > 0 || any(df$error)) {
            stop(sprintf(
              "Full test suite failed: %d failed expectation(s), %d test error(s).",
              sum(df$failed), sum(df$error)))
          }
          if (any(df$warning)) {
            cat("Test warnings were generated; inspect them before release.\n")
          }

          # The point of this job is that NOT_CRAN=true actually runs the Stan
          # tests, so a skip whose reason is CRAN means the coverage silently
          # went away and must fail the job. Every OTHER skip reason is
          # listed rather than failed on, because a test can legitimately skip
          # for a missing optional dependency or an absent toolchain. No test
          # currently carries skip_on_ci(); the listing is what makes one added
          # later visible, instead of quietly removing coverage from the only
          # job that runs the Stan suite.
          reasons <- unlist(lapply(res, function(f) {
            vapply(f$results, function(r) {
              if (inherits(r, "expectation_skip")) conditionMessage(r) else NA_character_
            }, character(1))
          }))
          reasons <- reasons[!is.na(reasons)]
          if (length(reasons)) {
            cat("Skipped:\n"); cat(paste0("  ", reasons, collapse = "\n"), "\n")
          }
          cran_skips <- grep("On CRAN", reasons, value = TRUE)
          if (length(cran_skips)) {
            stop(sprintf(
              "%d test(s) skipped with reason 'On CRAN' despite NOT_CRAN=true; the Stan suite did not run.",
              length(cran_skips)))
          }
        shell: Rscript {0}

      # rstan is the package's default and CRAN-available backend, but the sweep
      # above runs on cmdstanr and the matrix no longer touches skip_on_cran()
      # tests at all, so nothing else samples through rstan. Stan-export parity
      # proves the committed C++ matches inst/stan; it does not exercise the
      # rstan sampling call, draw extraction, chain labelling, diagnostics, or
      # the survival prediction methods reading a real rstan fit. This step
      # does, on the models most likely to break: a parametric SPFA fit, a
      # flexible-baseline fit, and a relaxed fit. The package is already
      # compiled by the sweep above, so this costs sampling time only.
      - name: rstan survival sampling smoke test
        run: |
          pkgload::load_all(".")
          stopifnot(identical(mlumr_engine(), "rstan"))
          source("tests/testthat/helper-survival.R")
          dat <- sim_survival_data(seed = 2026)

          check_fit <- function(fit, what) {
            stopifnot(inherits(fit, "mlumr_fit"), identical(fit$family, "survival"))
            stopifnot(nrow(fit$draws) > 0, length(fit$chain_ids) == nrow(fit$draws))
            stopifnot(is.numeric(fit$diagnostics$n_divergent))
            me <- marginal_effects(fit, effect = "rmstd")
            stopifnot(nrow(me) > 0, all(is.finite(me$mean)))
            pr <- predict(fit, type = "survival")
            stopifnot(nrow(pr) > 0, all(pr$mean >= 0 & pr$mean <= 1))
            cat(sprintf("rstan %s: %d draws, %d divergent, max Rhat %.3f\n",
                        what, nrow(fit$draws), fit$diagnostics$n_divergent,
                        max(fit$summary$Rhat, na.rm = TRUE)))
          }

          check_fit(fit_survival_test(dat, distribution = "weibull"),
                    "parametric SPFA (weibull)")
          check_fit(fit_survival_test(dat, distribution = "mspline", n_knots = 4),
                    "flexible baseline (m-spline)")
          check_fit(fit_survival_test(dat, model = "relaxed",
                                      distribution = "weibull"),
                    "relaxed (weibull)")
        shell: Rscript {0}

  declared-repository-chain:
    name: Declared repository chain (cmdstanr)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform where the two repositories most often carry
        # different cmdstanr versions, and where a toolchain fix present in one
        # and absent from the other actually changes whether a fit builds. It is
        # the reason this job exists, so it is not optional here.
        os: [ubuntu-latest, windows-latest]
    # Every other job installs cmdstanr from stan-dev/cmdstanr on GitHub, which
    # is NOT what DESCRIPTION selects. The repository chain this package
    # declares was therefore never exercised: the whole matrix could stay green
    # while `Additional_repositories` resolved to nothing installable, or to a
    # version that cannot build a model. This job installs the way a user does,
    # from the declared repositories and nothing else, and refuses to fall back.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # DESCRIPTION is the single source of truth for the chain under test, so
      # the URL is read from it rather than repeated here, and handed to both
      # the availability probe and the resolver below. It travels as DATA: a
      # file the later R steps read, never a step output spliced into their
      # source by the runner's expression syntax. Splicing it in would have let
      # a pull request that put quotes or a newline into
      # `Additional_repositories` run its own R code in this job, so the value
      # is also checked to be one plain https URL before anything uses it.
      - name: Read the declared repository from DESCRIPTION
        run: |
          extra <- read.dcf("DESCRIPTION", "Additional_repositories")[[1]]
          if (is.na(extra) || !nzchar(extra)) {
            stop("DESCRIPTION declares no Additional_repositories.")
          }
          extra <- trimws(extra)
          if (length(extra) != 1L ||
              !grepl("^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$", extra)) {
            stop("Additional_repositories must be a single plain https URL; got: ",
                 deparse(extra))
          }
          writeLines(extra, file.path(Sys.getenv("RUNNER_TEMP"), "declared_repo.txt"))
          cat("declared repository:", extra, "\n")
        shell: Rscript {0}

      # `setup-r-dependencies` resolves with pak, which does NOT read
      # `Additional_repositories` out of DESCRIPTION, and the action has no
      # input for adding a repository (passing `extra-repositories` is accepted
      # silently and ignored: GitHub logs "Unexpected input(s)" and the resolver
      # still reports "Can't find package called cmdstanr"). The portable way to
      # reach every later R session, pak's subprocess included, is the user
      # profile.
      - name: Put the declared repository on the R repository list
        run: |
          rprofile <- path.expand("~/.Rprofile")
          block <- c(
            'local({',
            '  r <- getOption("repos")',
            # A bare "@CRAN@" placeholder makes available.packages() error out
            # rather than resolve, so pin a mirror when one is not already set.
            '  if (is.na(r["CRAN"]) || identical(unname(r["CRAN"]), "@CRAN@")) {',
            '    r["CRAN"] <- "https://cloud.r-project.org"',
            '  }',
            sprintf('  r["stan"] <- "%s"',
                    readLines(file.path(Sys.getenv("RUNNER_TEMP"), "declared_repo.txt"))),
            '  options(repos = r)',
            '})')
          cat(block, sep = "\n", file = rprofile, append = TRUE)
          cat("\n", file = rprofile, append = TRUE)
          cat("appended to", rprofile, ":\n")
          cat(block, sep = "\n"); cat("\n")
        shell: Rscript {0}

      - name: Check the declared chain offers cmdstanr, and record the version
        run: |
          cat("repositories:\n"); print(getOption("repos"))
          av <- available.packages()
          if (!"cmdstanr" %in% rownames(av)) {
            stop("cmdstanr is not available from the declared repository chain: ",
                 paste(getOption("repos"), collapse = ", "))
          }
          cat("resolved cmdstanr version:", av["cmdstanr", "Version"], "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
          needs: check

      - name: Confirm cmdstanr came from the declared chain
        run: |
          # The resolver must not have satisfied cmdstanr from somewhere else.
          # `available.packages()` on the declared chain is the reference.
          declared <- readLines(file.path(Sys.getenv("RUNNER_TEMP"), "declared_repo.txt"))
          declared_version <- available.packages(repos = declared)["cmdstanr", "Version"]
          installed <- as.character(utils::packageVersion("cmdstanr"))
          cat("declared:", declared_version, " installed:", installed, "\n")
          if (!identical(declared_version, installed)) {
            stop("cmdstanr ", installed, " was installed, but the declared ",
                 "repository chain offers ", declared_version,
                 ": the resolver fell back to another source, so this job is ",
                 "not testing the chain DESCRIPTION declares.")
          }
          # The same version can be served by more than one repository, so the
          # version alone does not prove where pak took it from. pak records
          # the repository it resolved against in the installed DESCRIPTION;
          # when that record exists it has to name the declared repository.
          desc <- utils::packageDescription("cmdstanr")
          recorded <- unlist(desc[intersect(c("RemoteRepos", "RemoteUrl", "Repository"),
                                            names(desc))])
          recorded <- recorded[!is.na(recorded) & nzchar(recorded)]
          cat("recorded provenance:", if (length(recorded)) recorded else "(none)", "\n")
          host <- sub("^https://([^/]+).*$", "\\1", declared)
          if (length(recorded) && !any(grepl(host, recorded, fixed = TRUE))) {
            stop("cmdstanr's installed DESCRIPTION records it came from ",
                 paste(recorded, collapse = ", "), ", not from the declared ",
                 "repository ", declared, ".")
          }
        shell: Rscript {0}

      # The toolchain check is where the cost of pinning an old cmdstanr shows
      # up, and it is platform-specific: cmdstanr 0.8.0 predates current Rtools
      # and reports "Rtools44 was not found but is required to run CmdStan with
      # R version 4.6.1" on Windows, while the same version is fine on Linux and
      # macOS. Record the result rather than discovering it as an opaque failure
      # three steps later.
      - name: Check the CmdStan toolchain
        id: toolchain
        run: |
          msg <- NULL
          ok <- tryCatch({
            cmdstanr::check_cmdstan_toolchain(fix = FALSE, quiet = TRUE)
            TRUE
          }, error = function(e) {
            msg <<- conditionMessage(e)
            cat("toolchain unavailable:", msg, "\n")
            FALSE
          })
          # Tolerate ONLY the known consequence of the pin: a cmdstanr too old
          # to recognize this R version's Rtools. Accepting every Windows
          # exception would let a runner regression, a different cmdstanr
          # failure, or a genuinely broken toolchain pass as the expected
          # limitation, which is the opposite of what this job is for. So it
          # takes cmdstanr's exact sentence for that condition, and only from
          # the cmdstanr the pin is known to serve: the same sentence from a
          # 0.9.0 would mean the runner's Rtools changed, which is new.
          #
          # The sentence alone cannot tell an unrecognized Rtools from an
          # absent one: the pinned cmdstanr says the same thing when the
          # runner has lost its compiler. So R is asked directly, by building
          # one empty C file through R CMD SHLIB, which needs the Rtools that
          # setup-r installs and nothing from cmdstanr. Only when that works
          # is cmdstanr's failure the documented version limitation.
          compiler_works <- local({
            dir <- tempfile("probe")
            dir.create(dir)
            old <- setwd(dir)
            on.exit(setwd(old), add = TRUE)
            writeLines("void mlumr_probe(void) {}", "probe.c")
            out <- suppressWarnings(system2(file.path(R.home("bin"), "R"),
                                            c("CMD", "SHLIB", "probe.c"),
                                            stdout = TRUE, stderr = TRUE))
            built <- file.exists(paste0("probe", .Platform$dynlib.ext))
            if (!built) cat(out, sep = "\n")
            built
          })
          cat("compiler works:", compiler_works, "\n")
          expected <- !is.null(msg) && compiler_works &&
            grepl("was not found but is required to run CmdStan with R version",
                  msg, fixed = TRUE) &&
            utils::packageVersion("cmdstanr") < "0.9.0"
          cat("cmdstanr:", as.character(utils::packageVersion("cmdstanr")), "\n")
          cat("R:       ", R.version.string, "\n")
          cat(sprintf("ok=%s\n", tolower(as.character(ok))),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          # On the platforms where the pinned cmdstanr is known to work, a
          # toolchain failure is a real regression and must stop the job.
          if (!ok && .Platform$OS.type != "windows") {
            stop("the cmdstanr from the declared chain cannot find a working ",
                 "toolchain on this platform, which is a change from the known ",
                 "state and needs investigating before release")
          }
          if (!ok && !compiler_works) {
            stop("R cannot compile a C file on this runner, so Rtools is ",
                 "absent or broken here. That is a runner regression, not the ",
                 "documented limitation of the pinned cmdstanr, which only ",
                 "fails to recognize an Rtools that is present: ", msg)
          }
          if (!ok && !expected) {
            stop("the Windows toolchain check failed for a reason other than ",
                 "the known missing-Rtools limitation of the pinned cmdstanr. ",
                 "This is new breakage, not the documented cost of the pin: ",
                 msg)
          }
          if (!ok) {
            cat("\nKNOWN COST OF THE PINNED REPOSITORY: the declared chain ",
                "supplies a cmdstanr too old to recognize this R version's ",
                "Rtools, so CmdStan cannot be built here. Reverting the pin ",
                "would fix this and reintroduce the rstan/StanHeaders ",
                "resolution failure it exists to avoid; see the repository ",
                "watch workflow.\n", sep = "")
          }
        shell: Rscript {0}

      - name: Install CmdStan
        if: steps.toolchain.outputs.ok == 'true'
        run: cmdstanr::install_cmdstan(cores = 2)
        shell: Rscript {0}

      - name: Record the resolved software versions
        if: steps.toolchain.outputs.ok == 'true'
        run: |
          cat("cmdstanr:", as.character(utils::packageVersion("cmdstanr")), "\n")
          cat("CmdStan: ", cmdstanr::cmdstan_version(), "\n")
          cat("R:       ", R.version.string, "\n")
        shell: Rscript {0}

      - name: Sample through the chain this package declares
        if: steps.toolchain.outputs.ok == 'true'
        run: |
          pkgload::load_all(".")
          options(mlumr.stan_engine = "cmdstanr")
          # A smoke test, not the suite: the question is whether the cmdstanr
          # this chain resolves can compile and run one model end to end.
          data("psoriasis_ipd", package = "mlumr")
          data("psoriasis_agd", package = "mlumr")
          res <- testthat::test_file("tests/testthat/test-mlumr.R",
                                     package = "mlumr", reporter = "summary",
                                     stop_on_failure = FALSE)
          df <- as.data.frame(res)
          cat("pass", sum(df$passed), "fail", sum(df$failed),
              "error", sum(df$error), "\n")
          if (sum(df$failed) > 0 || any(df$error)) {
            stop("the declared repository chain does not produce a working cmdstanr")
          }
        shell: Rscript {0}
