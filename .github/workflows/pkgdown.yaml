# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # One deployment at a time. The web app and the lesson push the same
    # gh-pages branch from other workflows; `clean-exclude` and `force: false`
    # below keep the three writers from deleting or overwriting each other.
    concurrency:
      group: pkgdown
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            stan-dev/cmdstanr
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          # Remove pages for retired articles, but never the app or the lesson,
          # which other workflows deploy into their own subtrees here.
          clean: true
          clean-exclude: |
            app
            app/**
            lesson
            lesson/**
          # Rebase onto whatever the app or lesson deployment just pushed.
          force: false
          branch: gh-pages
          folder: docs
