# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs.
    #
    # The group is deliberately NOT pkgdown-specific for real deployments: the
    # app deploys to `app/` on the same gh-pages branch from its own workflow,
    # and the action force-pushes, so two writers running at once can lose one
    # of the two updates. Both writers must share one group to serialize them.
    concurrency:
      group: ${{ github.event_name != 'pull_request' && 'github-pages' || format('pkgdown-{0}', github.run_id) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            stan-dev/cmdstanr
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          # The vignette set was replaced, so pages for the retired
          # mlumr-models, model-comparison, stc-and-naive and worked-example
          # articles are no longer generated. With `clean: false` they would
          # stay on gh-pages and keep serving a site that no longer exists.
          clean: true
          # The web app is deployed separately into `app/` on this same
          # branch, and it is NOT part of the pkgdown artifact. Without this
          # exclusion, `clean: true` removes every destination file the docs
          # build did not produce, which includes the entire app subtree, and
          # the navbar's "Web app" entry starts serving a 404. Publishing a
          # release triggers this deployment, so the release itself is what
          # would have broken the link.
          clean-exclude: |
            app
            app/**
          branch: gh-pages
          folder: docs
