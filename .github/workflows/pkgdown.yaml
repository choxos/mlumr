# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs.
    #
    # Deliberately pkgdown-specific. Sharing one group with the app deployment
    # looked like serialization, but with the default queue a newly queued
    # member CANCELS the pending one, so a docs deployment arriving while an
    # app deployment waited would have discarded the app update entirely, and
    # silently. `queue: max` would serialize instead, but only if BOTH
    # workflows opt in, and they live on different branches. The two writers
    # are kept apart differently: `clean-exclude` below stops a docs
    # deployment from deleting `app/`, and `force: false` makes a push that
    # lands on a branch the app has just moved rebase onto it and retry rather
    # than overwrite it. Neither side cancels, and neither side loses a write.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            stan-dev/cmdstanr
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          # The vignette set was replaced, so pages for the retired
          # mlumr-models, model-comparison, stc-and-naive and worked-example
          # articles are no longer generated. With `clean: false` they would
          # stay on gh-pages and keep serving a site that no longer exists.
          clean: true
          # The web app is deployed separately into `app/` on this same
          # branch, and it is NOT part of the pkgdown artifact. Without this
          # exclusion, `clean: true` removes every destination file the docs
          # build did not produce, which includes the entire app subtree, and
          # the navbar's "Web app" entry starts serving a 404. Publishing a
          # release triggers this deployment, so the release itself is what
          # would have broken the link.
          clean-exclude: |
            app
            app/**
          # The app workflow pushes the same branch. A forced push from here
          # that raced it would replace its commit; without force the action
          # fetches, rebases this deployment onto whatever is there, and
          # retries, up to `attempt-limit` times. The two commits touch
          # disjoint paths, so the rebase is clean.
          force: false
          branch: gh-pages
          folder: docs
