# Builds mlumr Playground (an R IDE that runs in the browser) from this
# app-only branch and publishes it at https://choxos.github.io/mlumr/app .
#
# How this coexists with the pkgdown site (which owns the gh-pages root):
#   * pkgdown.yaml deploys docs/ to gh-pages with `clean: true` and a
#     `clean-exclude` of `app` and `app/**`, so it refreshes the package
#     website and never deletes the /app subtree.
#   * This workflow deploys ONLY into the gh-pages app/ subfolder
#     (target-folder: app) with `clean: true`, which is scoped to app/: it
#     purges stale files inside app/ but never touches pkgdown's root files.
#   * Both deployments push with `force: false`. The two workflows live on
#     different branches, so a shared concurrency group cannot serialize them,
#     and the action force-pushes by default: a push from either side that
#     raced the other would have replaced the other's commit. Without force
#     the action fetches, rebases its commit onto whatever is on gh-pages, and
#     retries, and the two commits touch disjoint paths, so the rebase is
#     clean.
# The load-bearing guardrails are pkgdown.yaml's `clean-exclude` and the two
# `force: false` lines; do not drop the exclusion or switch pkgdown to
# pkgdown::deploy_to_branch() (which defaults to clean = TRUE with no
# exclusion) or the next docs build would wipe /app.
#
# The Stan models are committed under models/ (build-models.sh compiles them
# with emscripten and verify/ checks them against native CmdStan); build.sh
# downloads webR, the WebAssembly R packages and the vignette sources, and
# bundles the site. GitHub Pages cannot send the COOP/COEP headers the
# Playground needs; coi-sw.js, a service worker in the site, adds them.
#
# A pull request into webapp runs the same build and checks (the Stan programs
# against the mlumr being packaged, the statement and View tests, the models
# against the native reference values) and deploys nothing.
name: deploy-app.yaml

on:
  push:
    branches: [webapp]
  pull_request:
    branches: [webapp]
  workflow_dispatch:

permissions:
  contents: write   # push the built app to the gh-pages branch

# Serialize writers to gh-pages to avoid non-fast-forward push failures; a
# pull request's build only replaces its own earlier run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('app-pr-{0}', github.event.number) || 'gh-pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # build.sh indexes the package repository and extracts the vignette code.
      - name: Install knitr and jsonlite
        run: Rscript -e 'install.packages(c("knitr", "jsonlite"))'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Playground
        run: bash build.sh

      - name: Check the models against native CmdStan's values
        run: node verify/check-models.mjs models verify/cases

      # Defense-in-depth: a root .nojekyll already exists (pkgdown re-emits it)
      # and covers /app, but carry one in the app build too.
      - name: Add .nojekyll to the build
        if: github.event_name != 'pull_request'
        run: touch site/.nojekyll

      - name: Deploy to gh-pages/app
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: site
          target-folder: app           # confines deploy + clean to /app
          clean: true                  # purge stale files, scoped to /app only
          # The docs workflow pushes the same branch. A forced push from here
          # that raced it would replace its commit; without force the action
          # rebases this deployment onto whatever is there and retries.
          force: false
          commit-message: "Deploy mlumr Playground to /app [skip ci]"
